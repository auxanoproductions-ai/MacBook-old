<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:540px;height:960px;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif;color:#fff}
#bg{position:absolute;inset:0}#dots{position:absolute;inset:0}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.big{font-size:54px;font-weight:900;line-height:1.08;text-transform:none}.big .w{display:inline-block;margin:0 6px}
.hl{background:#fff;color:var(--c);padding:0 10px;border-radius:8px}
.t{font-size:44px;font-weight:800;line-height:1.15}.s{font-size:26px;opacity:.85;margin-top:18px}
.step{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;margin:10px 0;width:440px;text-align:left;font-size:24px;font-weight:700}
.num{min-width:44px;height:44px;border-radius:50%;background:#fff;color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:900}
.phone{width:440px;background:#16161c;border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.bub{border-radius:18px;padding:14px 16px;font-size:20px;line-height:1.35;text-align:left;margin:8px 0}
.u{background:var(--c);margin-left:40px}.a{background:#2a2a33;margin-right:40px}
.lab{font-size:14px;opacity:.6;text-align:left;margin-top:6px}
.cta1{font-size:34px;font-weight:800}.kw{font-size:84px;font-weight:900;background:#fff;color:var(--c);padding:6px 26px;border-radius:18px;margin:20px 0;display:inline-block}
.cta2{font-size:24px;opacity:.9}.arrow{font-size:60px;margin-top:20px}
#cap{position:absolute;left:30px;right:30px;bottom:70px;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000}
#cap .on{color:#ffe14d}
#bar{position:absolute;top:0;left:0;height:6px;background:#fff}
#brand{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:3px;opacity:.7;font-weight:700}
</style></head><body><div id="bg"></div><canvas id="dots" width="540" height="960"></canvas><div id="stage"></div><div id="cap"></div><div id="bar"></div><div id="brand">AI MADE SIMPLE</div>
<script>
let R,T,cur=-1;const E=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-E(x),3),back=x=>{x=E(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function init(r,timeline){R=r;T=timeline;document.documentElement.style.setProperty('--c',r.color[0]);}
function build(sc){const st=document.getElementById('stage');let h='';
 if(sc.k=='hook'){h='<div class="layer"><div class="big">'+sc.t.split(' ').map(w=>'<span class="w'+(w==w.toUpperCase()&&w.length>1?' hl':'')+'">'+w+'</span>').join(' ')+'</div></div>'}
 else if(sc.k=='text'){h='<div class="layer"><div class="t">'+sc.t+'</div>'+(sc.s?'<div class="s">'+sc.s+'</div>':'')+'</div>'}
 else if(sc.k=='steps'){h='<div class="layer"><div class="t" style="margin-bottom:20px">'+sc.t+'</div>'+sc.items.map((x,i)=>'<div class="step"><div class="num">'+(i+1)+'</div>'+x+'</div>').join('')+'</div>'}
 else if(sc.k=='chat'){h='<div class="layer"><div class="phone"><div class="lab">You</div><div class="bub u" id="ut"></div><div class="lab">AI</div><div class="bub a" id="at"></div></div></div>'}
 else if(sc.k=='cta'){h='<div class="layer"><div class="cta1">Comment</div><div class="kw">'+R.kw+'</div><div class="cta2">I\'ll DM you the free resource</div><div class="arrow">👇</div></div>'}
 st.innerHTML=h;}
function render(t){const D=T[T.length-1].end;let i=T.findIndex(x=>t<x.end);if(i<0)i=T.length-1;const sc=R.scenes[i],s0=T[i].start,lt=t-s0,dur=T[i].end-s0;
 if(i!=cur){build(sc);cur=i}
 const g=document.getElementById('bg');const a=(t*20)%360;g.style.background='linear-gradient('+(160+Math.sin(t/3)*20)+'deg,'+R.color[0]+' 0%,'+R.color[1]+' 75%)';
 const c=document.getElementById('dots').getContext('2d');c.clearRect(0,0,540,960);for(let k=0;k<26;k++){const x=(k*97%540),y=(960-((t*30+k*137)%1000));c.fillStyle='rgba(255,255,255,'+(0.05+(k%5)*0.03)+')';c.beginPath();c.arc(x,y,2+(k%4)*2,0,7);c.fill()}
 const L=document.querySelector('.layer');const out=E((dur-lt)/0.25);if(L){L.style.opacity=Math.min(ease(lt/0.3),out);L.style.transform='scale('+(0.92+0.08*back(lt/0.4))+')'}
 if(sc.k=='hook')document.querySelectorAll('.w').forEach((w,j)=>{const p=back((lt-j*0.12)/0.3);w.style.transform='translateY('+(1-p)*40+'px) scale('+(0.6+0.4*p)+')';w.style.opacity=E((lt-j*0.12)/0.15)});
 if(sc.k=='steps')document.querySelectorAll('.step').forEach((w,j)=>{const st=0.3+j*dur*0.27;const p=ease((lt-st)/0.35);w.style.transform='translateX('+(1-p)*-80+'px)';w.style.opacity=p});
 if(sc.k=='chat'){const ut=document.getElementById('ut'),at=document.getElementById('at');const n=Math.floor(E(lt/(dur*0.45))*sc.u.length);ut.textContent=sc.u.slice(0,n)||' ';const ap=E((lt-dur*0.5)/0.3);at.style.opacity=ap;at.parentNode.children[2].style.opacity=ap;at.textContent=ap>0?sc.a.slice(0,Math.floor(E((lt-dur*0.5)/(dur*0.35))*sc.a.length)):''}
 if(sc.k=='cta'){const k=document.querySelector('.kw');k.style.transform='scale('+(1+0.06*Math.sin(lt*6))+')';document.querySelector('.arrow').style.transform='translateY('+Math.abs(Math.sin(lt*4))*18+'px)'}
 const ws=sc.vo.split(' ');const wi=Math.floor(E(lt/(dur-0.3))*ws.length);const cap=document.getElementById('cap');const start=Math.max(0,Math.floor(wi/5)*5);cap.innerHTML=ws.slice(start,start+5).map((w,j)=>'<span'+(start+j==wi?' class="on"':'')+'>'+w+'</span>').join(' ');
 document.getElementById('bar').style.width=(t/D*100)+'%';}
</script></body></html>
